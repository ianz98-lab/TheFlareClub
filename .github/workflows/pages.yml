name: Prototipo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Asegura que la fuente de Pages sea "GitHub Actions" (no la rama) para que la
      # compilación automática de Jekyll no pise el sitio exportado.
      - name: Fijar fuente de Pages en GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
      # npm en Windows omite del lockfile opcionales que solo existen en Linux (@emnapi/*);
      # si npm ci falla por eso, se instala con npm install.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
